<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Andrew Smith</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — rafrex/spa-github-pages
      // Redirects deep links (e.g. /terminal) to / with the original path
      // encoded in the query string; index.html restores it via history.replaceState.
      // pathSegmentsToKeep = 0 for user/org sites (root domain).
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
